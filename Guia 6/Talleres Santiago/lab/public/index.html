<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio OWASP Top 10:2025</title>
<link rel="icon" href="data:,">
<style>
  /* ---------- tokens: una sola capa, todo lo demas las consume ---------- */
  :root {
    /* color: neutros calidos, un acento. Rojo y verde difieren tambien en luminosidad (se leen en escala de grises) */
    --bg:#f6f4ef; --surface:#fffefb; --surface-2:#efece5;
    --ink:#1f2328; --ink-2:#3d4248; --muted:#5b5f66;
    --line:#dcd8cf; --line-strong:#bdb8ac; --line-field:#8f8a7e;
    --acc:#2b5c99; --acc-hover:#224a7c; --on-acc:#ffffff;
    --danger:#8c2a1c; --ok:#2a7348; --on-status:#ffffff;
    /* tipografia */
    --font-sans:"Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-mono:"Cascadia Mono", Consolas, monospace;
    --text-sm:.875rem; --text-base:1rem; --text-lg:1.1875rem; --text-xl:1.5rem;
    --text-display:clamp(2.25rem, 1.4rem + 2.4vw, 2.75rem);
    --leading-tight:1.12; --leading-body:1.55; --weight-strong:650;
    --measure-title:30ch; --measure-body:64ch;
    /* espacio (escala de 4) */
    --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.25rem;
    --sp-6:1.5rem; --sp-8:2rem; --sp-10:2.5rem; --sp-12:3rem;
    /* forma */
    --r-sm:.375rem; --r-md:.75rem; --r-pill:62.5rem;
    --bw:1px; --ring:3px; --tap:2.75rem; --stage-max:78rem; --out-min:7lh; --out-max:24rem;
    --gutter:var(--sp-4);
    /* movimiento */
    --dur:120ms; --ease:cubic-bezier(.2, .7, .2, 1); --disabled:.5; --busy:.6;
  }

  /* ---------- base: el telefono ---------- */
  * { box-sizing:border-box; }
  html { font-size:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:var(--text-base)/var(--leading-body) var(--font-sans); }
  h1, h2, h3, p { margin:0; }
  code { font-family:var(--font-mono); font-size:.92em; background:var(--surface-2); border-radius:var(--r-sm); padding:0 var(--sp-1); }
  [hidden] { display:none !important; }
  .sprite { position:absolute; width:0; height:0; overflow:hidden; }
  .icon { width:1.15em; height:1.15em; flex:none; }

  /* centrado del contenido sin perder el borde a borde del fondo */
  .topbar, .rail, .stage { padding-inline:max(var(--gutter), calc((100% - var(--stage-max)) / 2)); }

  .topbar { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:var(--sp-1) var(--sp-6); padding-block:var(--sp-4); }
  .brand { font-size:var(--text-lg); font-weight:var(--weight-strong); }
  .env { color:var(--muted); font-size:var(--text-sm); }

  /* pestañas: una franja horizontal bajo la barra */
  .rail { display:flex; gap:var(--sp-2); overflow-x:auto; padding-block:var(--sp-2) var(--sp-4); scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  .tab { flex:0 0 auto; display:flex; align-items:baseline; gap:var(--sp-3); min-height:var(--tap); font:inherit; color:var(--ink-2); background:transparent; border:var(--bw) solid var(--line-strong); border-radius:var(--r-pill); padding:var(--sp-2) var(--sp-4); cursor:pointer; white-space:nowrap; transition:background var(--dur) var(--ease), color var(--dur) var(--ease); }
  .tab:hover { background:var(--surface-2); }
  .tab:active { background:var(--line); }
  .tab[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:var(--surface); }
  .tab-code { font-family:var(--font-mono); font-weight:700; }
  .tab-name { font-weight:var(--weight-strong); }

  /* escenario */
  .stage { padding-block:var(--sp-4) var(--sp-12); outline:0; }
  .stage[aria-busy="true"] { opacity:var(--busy); }
  .loading { color:var(--muted); }
  .stage-head { margin-bottom:var(--sp-6); }
  .eyebrow { color:var(--acc); font-weight:var(--weight-strong); font-size:var(--text-base); margin-bottom:var(--sp-2); }
  .stage-title { font-size:var(--text-display); line-height:var(--leading-tight); letter-spacing:-.015em; max-width:var(--measure-title); margin-bottom:var(--sp-3); }
  .lead { font-size:var(--text-lg); color:var(--ink-2); max-width:var(--measure-body); }

  /* comparacion */
  .compare { display:grid; gap:var(--sp-5); grid-template-columns:minmax(0, 1fr); }
  .panel { display:grid; align-content:start; gap:var(--sp-4); background:var(--surface); border:var(--bw) solid var(--line-strong); border-radius:var(--r-md); padding:var(--sp-5); min-width:0; }
  .panel--wide { margin-bottom:var(--sp-5); }
  .panel-head { display:flex; flex-direction:column; align-items:flex-start; gap:var(--sp-2); }
  .panel-head h3 { font-size:var(--text-xl); line-height:var(--leading-tight); }
  .note { color:var(--ink-2); max-width:var(--measure-body); }
  .step { display:grid; gap:var(--sp-3); align-content:start; }
  .group-label { font-size:var(--text-base); font-weight:var(--weight-strong); color:var(--ink-2); }
  .controls { display:grid; gap:var(--sp-3); align-content:start; }
  .actions { display:flex; flex-wrap:wrap; gap:var(--sp-2); }
  .hint { font-size:var(--text-sm); color:var(--muted); }
  .session { font-size:var(--text-base); color:var(--muted); margin-top:var(--sp-2); }
  .session[data-on="true"] { color:var(--ok); font-weight:var(--weight-strong); }
  .change { font-size:var(--text-lg); font-weight:var(--weight-strong); }

  /* estado vulnerable / segura: icono + texto + forma distinta del icono, nunca solo color */
  .status { display:inline-flex; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-4); border-radius:var(--r-pill); font-size:var(--text-base); font-weight:var(--weight-strong); color:var(--on-status); }
  .status .icon { width:1.4em; height:1.4em; }
  .status--vuln { background:var(--danger); }
  .status--safe { background:var(--ok); }

  /* formularios */
  .field { display:grid; gap:var(--sp-1); }
  label { font-size:var(--text-sm); font-weight:var(--weight-strong); color:var(--ink-2); }
  input, textarea { width:100%; font:var(--text-sm)/1.5 var(--font-mono); color:var(--ink); background:var(--surface); border:var(--bw) solid var(--line-field); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); min-height:var(--tap); }
  textarea { resize:vertical; overflow-wrap:anywhere; }
  input:hover, textarea:hover { border-color:var(--muted); }
  .decoded { font-size:var(--text-base); color:var(--muted); overflow-wrap:anywhere; }
  .decoded code { color:var(--ink); }

  /* botones: relleno = lanza el ataque; contorno = uso legitimo o utilidad */
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:var(--tap); padding:var(--sp-2) var(--sp-4); font:inherit; font-weight:var(--weight-strong); color:var(--on-acc); background:var(--acc); border:var(--bw) solid var(--acc); border-radius:var(--r-sm); cursor:pointer; transition:background var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .btn:hover { background:var(--acc-hover); border-color:var(--acc-hover); }
  .btn:active { transform:translateY(var(--bw)); }
  .btn--quiet { color:var(--acc); background:transparent; }
  .btn--quiet:hover { color:var(--on-acc); }
  .btn:disabled { opacity:var(--disabled); cursor:not-allowed; transform:none; }
  .btn[aria-busy="true"] { cursor:progress; }
  :is(.btn, .tab, input, textarea):focus-visible { outline:var(--ring) solid var(--acc); outline-offset:var(--sp-1); }

  /* respuesta del servidor: primero el veredicto, luego el detalle */
  .out { background:var(--surface-2); border:var(--bw) solid var(--line); border-radius:var(--r-sm); overflow:hidden; align-self:start; }
  .verdict { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4); font-size:var(--text-lg); font-weight:var(--weight-strong); }
  .verdict .icon { width:1.5em; height:1.5em; }
  .verdict--bad { color:var(--on-status); background:var(--danger); }
  .verdict--good { color:var(--on-status); background:var(--ok); }
  .verdict--info { color:var(--ink); background:var(--line); }
  .out-bar { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-3); min-height:var(--tap); padding:var(--sp-1) var(--sp-3); font-size:var(--text-sm); color:var(--muted); }
  .chip { font-family:var(--font-mono); font-size:var(--text-base); font-weight:700; color:var(--ink); background:var(--surface); border:var(--bw) solid var(--line-strong); border-radius:var(--r-pill); padding:0 var(--sp-3); white-space:nowrap; }
  .out pre, .comments { margin:0; padding:var(--sp-3) var(--sp-4); font:var(--text-base)/1.5 var(--font-mono); color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere; min-height:var(--out-min); max-height:var(--out-max); overflow:auto; }
  .out .is-empty { font-family:var(--font-sans); font-size:var(--text-base); color:var(--muted); }
  .comments { display:grid; gap:var(--sp-2); align-content:start; font-family:var(--font-sans); }
  .comment { background:var(--surface); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); overflow-wrap:anywhere; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }

  /* ---------- se agrega ancho, nunca se quita ---------- */
  @media (min-width: 60em) {
    :root { --gutter:var(--sp-8); }
    /* cuatro pestañas de igual ancho en una sola fila, sin importar el largo del nombre */
    .rail { overflow-x:visible; }
    .tab { flex:1 1 0; flex-direction:column; align-items:flex-start; gap:0; white-space:normal; border-radius:var(--r-md); }
    .compare { grid-template-columns:repeat(2, minmax(0, 1fr)); column-gap:var(--sp-5); row-gap:0; }
  }
  /* filas homologas de ambos paneles a la misma altura: la respuesta de un lado queda frente a la del otro */
  @supports (grid-template-rows: subgrid) {
    @media (min-width: 60em) {
      .compare > .panel { grid-template-rows:subgrid; row-gap:var(--sp-4); }
      .compare[data-rows="4"] > .panel { grid-row:span 4; }
      .compare[data-rows="5"] > .panel { grid-row:span 5; }
    }
  }
  @media (min-width: 75em) {
    html { font-size:112.5%; }
    :root { --measure-title:44ch; }
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-shield-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m14.5 9.5-5 5"/><path d="m9.5 9.5 5 5"/></symbol>
  <symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
</svg>

<header class="topbar">
  <h1 class="brand">Laboratorio OWASP Top 10:2025</h1>
  <p class="env">Entorno local, solo uso educativo</p>
</header>
<nav id="tabs" class="rail" role="tablist" aria-label="Talleres" aria-orientation="horizontal"></nav>
<main id="panel" class="stage" role="tabpanel" tabindex="-1"><p class="loading">Cargando módulos...</p></main>

<script>
/*
 * Navegacion: la URL (#A01, #A02, ...) es la unica fuente de verdad. Clic, teclado y
 * atras/adelante solo cambian el hash; hashchange dibuja el panel. Cada script de un
 * panel corre dentro de su propia funcion y recibe (root, lab).
 */
const tabsEl = document.getElementById('tabs');
const panel = document.getElementById('panel');
let mods = [];
let ticket = 0;

const REASONS = { 200:'OK', 400:'Solicitud no válida', 401:'No autorizado', 403:'Prohibido', 404:'No encontrado',
                  429:'Demasiadas solicitudes', 500:'Error del servidor', 502:'Destino no disponible' };

const VEREDICTOS = {
  funciono:   { cls:'bad',  icono:'i-shield-x',     texto:'El ataque funcionó' },
  bloqueado:  { cls:'good', icono:'i-shield-check', texto:'El ataque fue bloqueado' },
  sinefecto:  { cls:'info', icono:'i-info',         texto:'El ataque no tuvo efecto' },
  paso:       { cls:'bad',  icono:'i-shield-x',     texto:'El ataque pasó la defensa' },
  fuga:       { cls:'bad',  icono:'i-shield-x',     texto:'El error revela datos internos' },
  permitido:  { cls:'info', icono:'i-info',         texto:'Uso legítimo permitido' },
  rechazado:  { cls:'info', icono:'i-info',         texto:'Solicitud rechazada' },
};

const lab = {
  V: VEREDICTOS,
  /** Resultado de una accion segun el tipo de panel y si la accion es un ataque. */
  clasificar(tipo, ataque, status) {
    const falla = status === 0 || status >= 400;
    if (ataque === 'fuga') return falla ? VEREDICTOS.fuga : VEREDICTOS.sinefecto;
    if (!ataque) return falla ? VEREDICTOS.rechazado : VEREDICTOS.permitido;
    if (tipo === 'safe') return falla ? VEREDICTOS.bloqueado : VEREDICTOS.paso;
    return falla ? VEREDICTOS.sinefecto : VEREDICTOS.funciono;
  },
  /** Pinta el veredicto en el .out indicado. */
  verdict(out, v, detalle) {
    const el = out.querySelector('[data-verdict]');
    if (!el) return;
    el.className = 'verdict verdict--' + v.cls;
    el.replaceChildren();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'icon');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#' + v.icono);
    svg.append(use);
    const t = document.createElement('span');
    t.textContent = v.texto + (detalle ? ': ' + detalle : '');
    el.append(svg, t);
    el.hidden = false;
  },
  /** Muestra estado HTTP, texto y veredicto en una salida (.out). */
  show(pre, status, text, ataque, etiqueta) {
    const out = pre.closest('.out');
    const chip = out.querySelector('[data-chip]');
    chip.hidden = false;
    chip.textContent = status ? status + ' ' + (REASONS[status] || '') : 'sin conexión';
    if (etiqueta) out.querySelector('[data-label]').textContent = etiqueta;
    pre.classList.remove('is-empty');
    pre.textContent = text;
    const tipo = pre.closest('.panel')?.dataset.kind;
    if (tipo) lab.verdict(out, lab.clasificar(tipo, ataque, status));
    // la respuesta debe quedar a la vista aunque el boton estuviera al fondo de la pantalla
    const calmo = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    out.scrollIntoView({ block: 'nearest', behavior: calmo ? 'auto' : 'smooth' });
  },
  async call(url, opts) {
    const r = await fetch(url, opts);
    let data = null;
    try { data = await r.json(); } catch { data = { error: 'La respuesta no es JSON' }; }
    return { status: r.status, data };
  },
  /** Ejecuta una peticion con el boton en estado de carga y pinta la respuesta. extra: { tweak, label, raw } */
  async run(btn, pre, url, opts, extra = {}) {
    const etiqueta = btn.textContent;
    btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Enviando...';
    let res;
    try { res = await lab.call(url, opts); }
    catch (e) { res = { status: 0, data: { error: 'No se pudo contactar al servidor: ' + e.message } }; }
    finally { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = etiqueta; }
    if (extra.tweak) res = extra.tweak(res);
    lab.show(pre, res.status, extra.raw ? extra.raw(res) : JSON.stringify(res.data, null, 2), btn.dataset.attack, extra.label);
    return res;
  },
};

function indexFromHash() {
  const i = mods.findIndex((m) => m.id === location.hash.slice(1));
  return i < 0 ? 0 : i;
}

function markSelected(i) {
  [...tabsEl.children].forEach((b, k) => {
    b.setAttribute('aria-selected', String(k === i));
    b.tabIndex = k === i ? 0 : -1;
  });
  panel.setAttribute('aria-labelledby', 'tab-' + mods[i].id);
  // en pantallas angostas la franja se desplaza: la pestaña activa debe verse
  tabsEl.children[i].scrollIntoView({ inline: 'center', block: 'nearest' });
}

function showError(m, err) {
  panel.textContent = '';
  const box = document.createElement('section');
  box.className = 'panel';
  const head = document.createElement('div');
  head.className = 'panel-head';
  const h = document.createElement('h3');
  h.textContent = 'No se pudo cargar el módulo ' + m.id;
  head.append(h);
  const out = document.createElement('pre');
  out.textContent = String(err && err.message ? err.message : err);
  box.append(head, out);
  panel.append(box);
}

async function show(i) {
  const mine = ++ticket;
  const m = mods[i];
  markSelected(i);
  panel.setAttribute('aria-busy', 'true');
  panel.innerHTML = '<p class="loading">Cargando ' + m.id + '...</p>';   // nunca dejar el modulo anterior bajo la pestaña nueva
  try {
    const res = await fetch('/fragments/' + m.fragment);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' al pedir ' + m.fragment);
    const html = await res.text();
    if (mine !== ticket) return;            // llego tarde: el usuario ya cambio de pestaña
    panel.innerHTML = html;
    for (const old of [...panel.querySelectorAll('script')]) {
      const code = old.textContent;
      old.remove();
      try { new Function('root', 'lab', code)(panel, lab); } catch (e) { showError(m, e); }
    }
  } catch (e) {
    if (mine === ticket) showError(m, e);
  } finally {
    if (mine === ticket) panel.removeAttribute('aria-busy');
  }
}

function syncFromHash() { if (mods.length) show(indexFromHash()); }

tabsEl.addEventListener('keydown', (ev) => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!(ev.key in step) && ev.key !== 'Home' && ev.key !== 'End') return;
  ev.preventDefault();
  const cur = indexFromHash();
  const next = ev.key === 'Home' ? 0 : ev.key === 'End' ? mods.length - 1 : (cur + step[ev.key] + mods.length) % mods.length;
  location.hash = mods[next].id;
  tabsEl.children[next].focus();
});

window.addEventListener('hashchange', syncFromHash);

(async () => {
  try {
    const res = await fetch('/api/modules');
    mods = await res.json();
  } catch (e) {
    panel.textContent = 'No se pudo leer la lista de módulos: ' + e.message;
    return;
  }
  if (!mods.length) { panel.textContent = 'No hay módulos cargados.'; return; }
  mods.forEach((m) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.role = 'tab';
    b.className = 'tab';
    b.id = 'tab-' + m.id;
    b.setAttribute('aria-controls', 'panel');
    for (const [cls, text] of [['tab-code', m.id], ['tab-name', m.title]]) {
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = text;
      b.append(s);
    }
    b.title = m.short;
    b.addEventListener('click', () => { location.hash = m.id; });
    tabsEl.append(b);
  });
  if (!location.hash) history.replaceState(null, '', '#' + mods[0].id);
  syncFromHash();
})();
</script>
</body>
</html>
